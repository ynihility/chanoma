<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ちゃのま</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    .cards { display: flex; gap: 16px; }
    /* 下からふわっと現れる動き。backwards で開始前(遅延中)も透明のままにして、ちらつきを防ぐ */
    .card { font-size: 24px; padding: 24px; animation: card-in 400ms ease-out backwards; }
    /* 札ごとに0.065秒(65ミリ秒)ずつ開始をずらす */
    .card:nth-child(2) { animation-delay: 65ms; }
    .card:nth-child(3) { animation-delay: 130ms; }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="cards">
    <button class="card">場面1</button>
    <button class="card">場面2</button>
    <button class="card">場面3</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
