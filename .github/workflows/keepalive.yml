# 審査期間（2026-11-08〜11-09）だけ、無料の置き場所が寝ないように 10 分おきに表紙を取りに行く。
# Claude は呼ばない（API のクレジットは使わない）。審査が終わったら、このファイルを消すか schedule をコメントにする。
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the free instance
        run: |
          # 起きるまで 50 秒以上かかることがあるので、待ち時間を長めに取る。失敗してもジョブは落とさない
          curl -sS -o /dev/null -w "status %{http_code} time %{time_total}s\n" --max-time 90 https://chanoma-ynihility.onrender.com/ || true
